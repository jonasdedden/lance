# This crate is intentionally NOT a member of the root Lance workspace: it pins
# Arrow 59 / DataFusion 55 (the versions Sail builds against), while the Lance
# workspace is on Arrow 58 / DataFusion 54. See README.md.
[workspace]

[package]
name = "sail-lance"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Lance data source for Sail, the Rust-native Apache Spark replacement"
publish = false

[features]
default = []
# Object store backends are forwarded to Lance. They are off by default so the
# proof of concept builds quickly against the local filesystem.
aws = ["lance/aws"]
azure = ["lance/azure"]
gcp = ["lance/gcp"]

[dependencies]
# The Lance side of the bridge: Arrow 58.
lance = { path = "../../rust/lance", default-features = false }
lance-file = { path = "../../rust/lance-file" }
lance-table = { path = "../../rust/lance-table" }
arrow-lance = { package = "arrow", version = "58.3", default-features = false, features = ["ffi"] }

# The Sail side of the bridge: Arrow 59 / DataFusion 55. These are pinned to the
# exact versions in Sail's lockfile at the revision below, because a DataFusion
# patch release changes the types this crate exchanges with Sail.
sail-common-datafusion = { git = "https://github.com/lakehq/sail.git", rev = "67b3cc5e090ee372a97d3d0a25d41d89c5c79ba0" }
arrow = { version = "=59.2.0", default-features = false, features = ["ffi"] }
# The feature set mirrors Sail's. Cargo unifies features across a build, so
# enabling one Sail leaves off (for example `sql`, which adds a variant to
# `DataFusionError`) would stop Sail itself from compiling.
datafusion = { version = "=55.0.0", default-features = false, features = [
    "nested_expressions",
    "crypto_expressions",
    "datetime_expressions",
    "encoding_expressions",
    "regex_expressions",
    "string_expressions",
    "unicode_expressions",
    "compression",
    "parquet",
    "serde",
    "avro",
    "recursive_protection",
] }
datafusion-common = { version = "=55.0.0", features = ["object_store"] }
datafusion-expr = { version = "=55.0.0", default-features = false }

async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["rt", "sync"] }
url = "2.5"

# The same lints Sail applies to its own crates, so this crate can be moved
# into the Sail tree unchanged.
[lints.clippy]
allow_attributes = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
